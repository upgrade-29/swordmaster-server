#RDS 설정
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/swordmaster?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Elasticashe Valkey 설정 전송중 암호화 true
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=true

#하이버네이트 ddl 설정은 운영단계에선 검증만. 테이블은 따로 생성이 필요
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

jwt.secret=${JWT_SECRET}


#flyway (운영은 항상 켬, V1이 존재하지 않는 기존 DB를 V1으로 간주하지 않음)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false